[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "zonas-geojson"
version = "1.0.0"
description = "Junção local de pontos com zonas GeoJSON, fronteiras explícitas e predicados racionais exatos."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Martin Lofrano / LOFRANO TECNOLOGIA"}]
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.scripts]
zonas-geojson = "zonas_geojson.cli:main"

[project.urls]
Homepage = "https://lofranotecnologia.com.br/"
Repository = "https://github.com/martinlofranodeoliveira/zonas-geojson"
Issues = "https://github.com/martinlofranodeoliveira/zonas-geojson/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["zonas_geojson"]
namespaces = false

[tool.setuptools.package-data]
zonas_geojson = ["data/*.geojson"]
